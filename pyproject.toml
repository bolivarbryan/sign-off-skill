[project]
name = "sign-off-skill"
version = "2.0.0"
description = "Claude Code plugin: an orderly sign-off ritual that saves session context to a per-project memory card."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/sign-off/scripts"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["skills/sign-off/scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
